# Dependabot - aggiornamenti settimanali per dipendenze runtime e automazioni GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:10"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # Major bloccanti o accoppiati: restano manuali finché la catena peer non
    # è compatibile. React Router 8 richiede una migrazione coordinata e oggi
    # `@vercel/react-router@1.3.1` dichiara peer su React Router 7, quindi i
    # bump parziali generano PR Dependabot non installabili e deploy Vercel
    # falliti. Prisma 7 richiede migrazione dedicata; i tipi Node restano su
    # Node 24 finché il runtime dichiarato è `>=24.15 <25`.
    ignore:
      - dependency-name: react-router
        update-types:
          - version-update:semver-major
      - dependency-name: "@react-router/dev"
        update-types:
          - version-update:semver-major
      - dependency-name: "@react-router/fs-routes"
        update-types:
          - version-update:semver-major
      - dependency-name: "@react-router/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vercel/react-router"
        update-types:
          - version-update:semver-major
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:20"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
