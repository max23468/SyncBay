name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"].strip()
          pattern = re.compile(
              r"^(feat|fix|perf|docs|test|chore|ci|refactor|build|style)"
              r"(\([a-z0-9._-]+\))?!?: .*\S$"
          )
          if not pattern.fullmatch(title):
              print(f"Titolo PR non valido: {title!r}", file=sys.stderr)
              print(
                  "Usa Conventional Commit, per esempio "
                  "'ci: streamline checks' o 'fix: restore stock fallback'.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
