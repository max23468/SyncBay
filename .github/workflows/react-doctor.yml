name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          node-version: 24
          version: 0.5.8
          # Niente commento riassuntivo "sticky": le PR pulite non ricevono
          # commenti. L'action mantiene il gate sui file cambiati nelle PR e
          # usa Node 24 senza cache package-manager interna.
          comment: false
