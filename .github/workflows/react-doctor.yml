name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app/**/*.ts"
      - "app/**/*.tsx"
      - "app/**/*.css"
      - "package.json"
      - "package-lock.json"
      - "react-router.config.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/react-doctor.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: React Doctor sui file cambiati
        if: github.event_name == 'pull_request'
        uses: millionco/react-doctor@v2
        with:
          node-version: 24
          version: latest
          blocking: error
          scope: changed
          # Niente commento riassuntivo "sticky": le PR pulite non ricevono
          # commenti. L'action mantiene il gate sui file cambiati nelle PR e
          # usa Node 24 senza cache package-manager interna.
          comment: false
          review-comments: true

      - name: Setup Node per React Doctor full manuale
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installa dipendenze per React Doctor full manuale
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: React Doctor full manuale
        if: github.event_name == 'workflow_dispatch'
        run: npm run quality:react-doctor
