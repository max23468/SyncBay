name: Audit produzione

# `audit:prod` dipende dal database advisory, non dal diff: come check richiesto
# renderebbe rossa ogni PR aperta quando una vulnerabilità viene pubblicata a
# monte, anche per una modifica di sola documentazione. Sta qui, su cadenza
# propria, e resta nei gate locali di `verify:changed` e `verify:full`.

on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/syncbay-audit-prod.mjs"
      - ".github/workflows/audit-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Advisory dipendenze produzione
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dipendenze deterministico
        run: npm ci

      - name: Audit dipendenze di produzione
        run: npm run audit:prod
