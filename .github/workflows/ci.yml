name: CI

# CI proporzionata al diff SyncBay (ADR 0004). La corsia docs-only mantiene un
# check conclusivo leggero; la corsia runtime usa il verifier seriale canonico.
# I gate con provider live restano fuori e girano in locale quando pertinenti.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica proporzionata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classifica il diff
        id: lane
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          else
            echo "lane=runtime" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          node scripts/syncbay-verify.mjs classify --base "$base" >> "$GITHUB_OUTPUT"

      - name: Verifica documentazione
        if: steps.lane.outputs.lane == 'docs'
        run: git diff --check "${{ steps.lane.outputs.base }}"

      - name: Setup Node
        if: steps.lane.outputs.lane == 'runtime'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dipendenze deterministico
        if: steps.lane.outputs.lane == 'runtime'
        run: npm ci

      - name: Ripristina cache Chromium Playwright
        if: steps.lane.outputs.lane == 'runtime'
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installa dipendenze di sistema Chromium
        if: steps.lane.outputs.lane == 'runtime'
        run: npx playwright install-deps chromium

      - name: Installa Chromium su cache miss
        if: steps.lane.outputs.lane == 'runtime' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Verifica runtime completa
        if: steps.lane.outputs.lane == 'runtime'
        run: npm run verify:full -- --no-receipt
