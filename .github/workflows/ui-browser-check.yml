name: UI browser check

on:
  pull_request:
    types: [labeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-ui:
    name: Render e hydration UI
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ui-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Cache Chromium Playwright
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installa dipendenze Chromium
        run: npx playwright install-deps chromium

      - name: Installa Chromium su cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - run: npm run ui:check

      - run: npm run ui:browser-check
